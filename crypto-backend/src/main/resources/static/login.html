<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/auth.css">
</head>
<body>
<header class="top-nav">
    <div class="logo">CryptoDash</div>
</header>

<div class="auth-container">
    <div class="auth-card">
        <h2>Login</h2>
        <form id="login-form">
            <div class="form-group">
                <label for="username">Username</label>
                <input type="text" id="username" placeholder="Enter your username" required>
            </div>
            <div class="form-group">
                <label for="password">Password</label>
                <input type="password" id="password" placeholder="Enter your password" required>
            </div>
            <button type="submit" class="btn btn-primary">Login</button>
        </form>
        <div id="auth-message" class="auth-message hidden"></div>

        <button id="google-signin-btn" class="google-signin-btn">
            <img src="https://upload.wikimedia.org/wikipedia/commons/thumb/c/c1/Google_%22G%22_logo.svg/512px-Google_%22G%22_logo.svg.png" alt="Google logo">
            Sign in with Google
        </button>

        <p class="auth-link">Don't have an account? <a href="register.html">Register here</a></p>
    </div>
</div>

<script type="module" src="js/script.js"></script>
</body>
</html>
